# Generado con npm run api:generate; editar scripts/generate-openapi.mjs
openapi: 3.0.3
info:
  title: MecaGest API
  version: 1.0.0
  description: Monolito académico para un taller. Todos los textos se recortan y rechazan campos desconocidos.
    No se envían credenciales en la URL. Los ejemplos son ficticios. La autenticación habilita los permisos
    del rol, no el acceso a otros talleres. Despliegue local de evaluación; no incluye facturación, pagos ni
    multi-taller.
servers:
  - url: /
    description: Mismo servidor que sirve este contrato
security:
  - bearerAuth: []
tags:
  - name: Sistema
  - name: Sesión
  - name: Catálogos
  - name: CU-01 Ingreso
  - name: CU-02 Diagnóstico
  - name: CU-03 Autorización
  - name: CU-04 Reparación
  - name: CU-05 Historial
paths:
  /health:
    get:
      operationId: health
      summary: Comprobar que responde el proceso HTTP
      description: No verifica servicios externos ni acredita disponibilidad de 8 horas.
      tags:
        - Sistema
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "400":
          description: El cuerpo no contiene JSON válido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_JSON
                  message: El cuerpo no contiene JSON válido
        "413":
          description: El cuerpo excede 32 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: BODY_TOO_LARGE
                  message: El cuerpo excede 32 KB
        "500":
          description: No se pudo completar la operación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INTERNAL_ERROR
                  message: No se pudo completar la operación
      security: []
  /api/auth/login:
    post:
      operationId: login
      summary: Iniciar sesión
      description: Credenciales generadas por npm run seed. Responde INVALID_CREDENTIALS (401) si no coinciden.
        Token Bearer opaco con vigencia de 8 horas. Máximo 10 intentos/IP/minuto.
      tags:
        - Sesión
      responses:
        "200":
          description: Operación completada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: El cuerpo no contiene JSON válido
