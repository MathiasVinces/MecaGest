                properties:
                  field:
                    type: string
                  message:
                    type: string
                    minLength: 1
                    maxLength: 2000
    OrderDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - vehicleId
        - mechanicId
        - reason
        - status
        - createdAt
        - updatedAt
        - diagnosis
        - authorization
        - repairs
      properties:
        id:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        mechanicId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        status:
          type: string
          enum:
            - RECEIVED
            - DIAGNOSING
            - AWAITING_AUTHORIZATION
            - AUTHORIZED
            - REJECTED
            - IN_REPAIR
            - BLOCKED
            - COMPLETED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        diagnosis:
          type: object
          additionalProperties: false
          required:
            - orderId
            - findings
            - recommendedWork
            - complete
            - recordedBy
            - updatedAt
          properties:
            orderId:
              type: string
              format: uuid
            findings:
              type: string
              minLength: 1
              maxLength: 2000
            recommendedWork:
              type: string
