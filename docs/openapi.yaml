components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token obtenido con POST /api/auth/login
  schemas:
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - username
        - role
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 1
          maxLength: 80
        role:
          type: string
          enum:
            - ADMIN
            - RECEPTIONIST
            - MECHANIC
    LoginInput:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    Session:
      type: object
      additionalProperties: false
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          pattern: ^[a-f0-9]{64}$
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    ClientInput:
      type: object
      additionalProperties: false
      required:
        - name
        - phone
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: ^[+0-9 ()-]{5,25}$
    Client:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - phone
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          minLength: 5
          maxLength: 25
        createdAt:
          type: string
          format: date-time
    VehicleInput:
      type: object
      additionalProperties: false
      required:
        - clientId
        - plate
        - brand
        - model
      properties:
        clientId:
          type: string
          format: uuid
        plate:
          type: string
          maxLength: 14
          pattern: ^[a-zA-Z0-9 -]+$
          description: Se eliminan espacios y guiones y se convierte a mayúsculas. El resultado debe tener entre 5 y 10
            letras o dígitos.
        brand:
          type: string
          minLength: 1
          maxLength: 80
        model:
          type: string
          minLength: 1
          maxLength: 80
    Vehicle:
      type: object
      additionalProperties: false
      required:
        - id
        - clientId
        - plate
        - brand
        - model
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        plate:
          type: string
          pattern: ^[A-Z0-9]{5,10}$
        brand:
          type: string
          minLength: 1
          maxLength: 80
        model:
          type: string
          minLength: 1
          maxLength: 80
        createdAt:
          type: string
          format: date-time
    OrderInput:
      type: object
      additionalProperties: false
      required:
        - vehicleId
        - mechanicId
        - reason
      properties:
        vehicleId:
          type: string
          format: uuid
        mechanicId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    Order:
      type: object
      additionalProperties: false
      required:
        - id
        - vehicleId
        - mechanicId
        - reason
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        mechanicId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        status:
          type: string
          enum:
            - RECEIVED
            - DIAGNOSING
            - AWAITING_AUTHORIZATION
            - AUTHORIZED
            - REJECTED
            - IN_REPAIR
            - BLOCKED
            - COMPLETED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DiagnosisInput:
      type: object
      additionalProperties: false
