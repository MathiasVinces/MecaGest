        "401":
          description: Inicia sesión para continuar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: UNAUTHENTICATED
                  message: Inicia sesión para continuar
        "413":
          description: El cuerpo excede 32 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: BODY_TOO_LARGE
                  message: El cuerpo excede 32 KB
        "422":
          description: Revisa los campos de la solicitud
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: Revisa los campos de la solicitud
        "429":
          description: Máximo 10 intentos de inicio de sesión por minuto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: TOO_MANY_ATTEMPTS
                  message: Máximo 10 intentos de inicio de sesión por minuto
        "500":
          description: No se pudo completar la operación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INTERNAL_ERROR
                  message: No se pudo completar la operación
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
