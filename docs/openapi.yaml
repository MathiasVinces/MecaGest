          required:
            - orderId
            - decision
            - evidence
            - recordedBy
            - createdAt
          properties:
            orderId:
              type: string
              format: uuid
            decision:
              type: string
              enum:
                - APPROVED
                - REJECTED
            evidence:
              type: string
